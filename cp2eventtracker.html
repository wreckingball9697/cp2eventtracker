<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="wreckingball" />
    <meta name="version" content="1.0.0" />
    <title>CP2 Events</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div id="controls">
      <div class="group">
        <label>Set game clock</label>
        <input type="number" id="ffMin" placeholder="min" />
        <span>:</span>
        <input type="number" id="ffSec" placeholder="sec" />
        <button id="ffBtn">Set</button>
      </div>

      <div class="group">
        <label>Spine killed at</label>
        <input type="number" id="ultraInputMin" placeholder="min" />
        <span>:</span>
        <input type="number" id="ultraInputSec" placeholder="sec" />
        <button id="ultraBtn" class="primary">Add Spine Killed Time</button>
      </div>

      <button id="resetBtn" class="danger">Reset Game Clock</button>
      <button id="pauseBtn">Pause Clock</button>

      <div id="filterWrap">
        <button id="filterBtn">Filter Events &#9662;</button>
        <div id="filterMenu">
          <div class="filter-actions">
            <button id="filterAllBtn">All</button>
            <button id="filterNoneBtn">None</button>
          </div>
        </div>
      </div>

      <div id="soundWrap">
        <button id="soundBtn">Sound Alerts &#9662;</button>
        <div id="soundMenu"></div>
      </div>

      <div id="gameClock">
        <div class="clock-main">
          Game clock <b id="gameClockVal">00:00:00</b>
        </div>
        <div class="stepper">
          <div class="step-group">
            <button class="step-btn" id="clockMinUp">&#9650;</button>
            <span>min</span>
            <button class="step-btn" id="clockMinDown">&#9660;</button>
          </div>
          <div class="step-group">
            <button class="step-btn" id="clockSecUp">&#9650;</button>
            <span>sec</span>
            <button class="step-btn" id="clockSecDown">&#9660;</button>
          </div>
        </div>
      </div>
    </div>

    <div id="main">
      <div id="eventPanel">
        <h2>Upcoming Events</h2>
        <div id="eventList"></div>
      </div>

      <div id="portalPanel">
        <h3>Portal List (75)</h3>
        <div id="staticList"></div>
      </div>
    </div>
  </body>
</html>
