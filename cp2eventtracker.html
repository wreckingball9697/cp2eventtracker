<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="author" content="wreckingball">
<meta name="version" content="1.0.0">
<title>CP2 Events</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #171a21;
    --panel-border: #2a2f3a;
    --text: #e8e9ed;
    --text-dim: #8b909c;
    --accent: #ffb020;
    --accent-dim: #7a5a17;
    --danger: #e0554f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ~~~~~ Controls bar ~~~~~ */
  #controls {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 20px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-border);
  }
  #controls .group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #controls label {
    font-size: 12px;
    color: var(--text-dim);
  }
  #controls input[type="number"] {
    width: 65px;
    background: #0f1115;
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 14px;
  }
  button {
    background: #2a2f3a;
    color: var(--text);
    border: 1px solid #3a4150;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #343b48; }
  button.primary {
    background: var(--accent);
    color: #1a1300;
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover { background: #ffc04d; }
  button.danger {
    background: transparent;
    color: var(--danger);
    border-color: var(--danger);
  }
  /* ~~~~~ Filter dropdown ~~~~~ */
  #filterWrap {
    position: relative;
  }
  #filterMenu {
    display: none;
    flex-direction: column;
    gap: 2px;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 220px;
    max-height: 320px;
    overflow-y: auto;
    background: #1d212b;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px;
    box-shadow: 0 12px 28px -6px rgba(0,0,0,.5);
    z-index: 30;
  }
  #filterMenu.open { display: flex; }
  #filterMenu .filter-actions {
    display: flex;
    gap: 6px;
    padding-bottom: 6px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--panel-border);
  }
  #filterMenu .filter-actions button {
    flex: 1 1 auto;
    padding: 4px 6px;
    font-size: 11px;
  }
  #filterMenu label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
    padding: 4px 6px;
    border-radius: 5px;
    cursor: pointer;
  }
  #filterMenu label:hover { background: #262b36; }

  /* ~~~~~ Sound dropdown ~~~~~ */
  #soundWrap { position: relative; }
  #soundMenu {
    display: none;
    flex-direction: column;
    gap: 2px;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 380px;
    max-height: 380px;
    overflow-y: auto;
    background: #1d212b;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 8px;
    box-shadow: 0 12px 28px -6px rgba(0,0,0,.5);
    z-index: 30;
  }
  #soundMenu.open { display: flex; }
  #soundMenu .preview-row,
  #soundMenu .sound-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding-bottom: 8px;
    margin-bottom: 6px;
    border-bottom: 1px solid var(--panel-border);
  }
  #soundMenu .preview-row button,
  #soundMenu .sound-actions button {
    flex: 1 1 auto;
    padding: 5px 6px;
    font-size: 11px;
  }
  .sound-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    padding: 4px 6px;
    border-radius: 5px;
  }
  .sound-row:hover { background: #262b36; }
  .sound-row .ev-name {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sound-row select {
    background: #0f1115;
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 5px;
    padding: 3px 4px;
    font-size: 11px;
  }
  .sound-row .preview-btn {
    padding: 3px 7px;
    font-size: 11px;
  }

  #gameClock {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-dim);
    background: #1d212b;
    border: 2px solid var(--accent);
    border-radius: 10px;
    padding: 8px 18px;
    box-shadow: 0 0 18px -4px rgba(255, 176, 32, 0.5);
  }
  #gameClock b {
    color: var(--accent);
    font-size: 30px;
    font-weight: 700;
  }
  #gameClock .clock-main {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  #gameClock .stepper {
    display: flex;
    gap: 6px;
  }
  #gameClock .step-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }
  #gameClock .step-group span {
    font-size: 9px;
    letter-spacing: normal;
    text-transform: none;
    color: var(--text-dim);
    line-height: 1;
  }
  #gameClock .step-btn {
    width: 22px;
    height: 16px;
    padding: 0;
    font-size: 9px;
    line-height: 1;
    background: #2a2f3a;
    border: 1px solid #3a4150;
    border-radius: 3px;
    color: var(--text);
    cursor: pointer;
  }
  #gameClock .step-btn:hover { background: #343b48; }

  /* ~~~~~ Main Layout ~~~~~ */
  #main {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
    padding: 16px;
    gap: 16px;
  }

  /* ~~~~~ Events List ~~~~~ */
  #eventPanel {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    overflow: hidden;
  }
  #eventPanel h2 {
    margin: 0;
    padding: 14px 20px;
    font-size: 15px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 1px solid var(--panel-border);
    flex: 0 0 auto;
  }
  #eventList {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .event-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 14px 20px;
    border-radius: 10px;
    background: #1d212b;
    border: 1px solid var(--panel-border);
  }
  .event-row .left {
    min-width: 0;
  }
  .event-row .name {
    font-size: 18px;
    font-weight: 600;
  }
  .event-row .id {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 400;
    margin-top: 2px;
  }
  .event-row .desc {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .event-row .timer {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .event-row .timer .gametime {
    display: block;
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
  }
  .event-row .timer .countdown {
    display: block;
    font-size: 13px;
    font-weight: 400;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* ~~~~~ Next Event ~~~~~ */
  .event-row.next {
    background: linear-gradient(135deg, #3a2e0f, #1d212b);
    border: 2px solid var(--accent);
    padding: 26px 28px;
    box-shadow: 0 0 24px -4px rgba(255, 176, 32, 0.4);
    color: var(--accent);
  }
  .event-row.next.imminent {
    animation: next-event-flash 2.8s ease-in-out infinite;
  }
  @keyframes next-event-flash {
    0%, 100% {
      box-shadow: 0 0 24px -4px rgba(255, 176, 32, 0.4);
      border-color: var(--accent);
      color: var(--accent);
    }
    50% {
      box-shadow: 0 0 46px 8px rgba(255, 214, 133, 0.95);
      border-color: #fff3d6;
      color: #fff3d6;
    }
  }
  .event-row.next .name {
    font-size: 30px;
    color: inherit;
  }
  .event-row.next .timer .gametime {
    font-size: 46px;
    color: inherit;
  }
  .event-row.next .timer .countdown {
    font-size: 16px;
    color: #d9a54a;
  }

  /* ~~~~~ Portal List ~~~~~ */
  #portalPanel {
    flex: 0 0 260px;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: #131519;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
    opacity: 0.85;
  }
  #portalPanel h3 {
    margin: 0;
    padding: 10px 14px;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 1px solid var(--panel-border);
    flex: 0 0 auto;
  }
  #staticList {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 14px;
    font-size: 12.5px;
    color: var(--text-dim);
    line-height: 1.9;
  }
  #staticList div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #staticList .idx { color: #565c68; margin-right: 6px; }
  .plasma-highlight { color: #ff6fb3; font-weight: 700; }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333a47; border-radius: 6px; }
</style>
</head>
<body>

<div id="controls">
  <div class="group">
    <label>Set game clock</label>
    <input type="number" id="ffMin" placeholder="min">
    <span>:</span>
    <input type="number" id="ffSec" placeholder="sec">
    <button id="ffBtn">Set</button>
  </div>

  <div class="group">
    <label>Spine killed at</label>
    <input type="number" id="ultraInputMin" placeholder="min">
    <span>:</span>
    <input type="number" id="ultraInputSec" placeholder="sec">
    <button id="ultraBtn" class="primary">Add Spine Killed Time</button>
  </div>

  <button id="resetBtn" class="danger">Reset Game Clock</button>
  <button id="pauseBtn">Pause Clock</button>

  <div id="filterWrap">
    <button id="filterBtn">Filter Events &#9662;</button>
    <div id="filterMenu">
      <div class="filter-actions">
        <button id="filterAllBtn">All</button>
        <button id="filterNoneBtn">None</button>
      </div>
    </div>
  </div>

  <div id="soundWrap">
    <button id="soundBtn">Sound Alerts &#9662;</button>
    <div id="soundMenu"></div>
  </div>

  <div id="gameClock">
    <div class="clock-main">Game clock <b id="gameClockVal">00:00:00</b></div>
    <div class="stepper">
      <div class="step-group">
        <button class="step-btn" id="clockMinUp">&#9650;</button>
        <span>min</span>
        <button class="step-btn" id="clockMinDown">&#9660;</button>
      </div>
      <div class="step-group">
        <button class="step-btn" id="clockSecUp">&#9650;</button>
        <span>sec</span>
        <button class="step-btn" id="clockSecDown">&#9660;</button>
      </div>
    </div>
  </div>
</div>

<div id="main">
  <div id="eventPanel">
    <h2>Upcoming Events</h2>
    <div id="eventList"></div>
  </div>

  <div id="portalPanel">
    <h3>Portal List (75)</h3>
    <div id="staticList"></div>
  </div>
</div>

<script>
  // 1 in-game second equivalent to .70 real seconds
  const GAME_SEC_PER_REAL_SEC = 1 / 0.70;

  // game clock starts at 20 seconds as the game starts at that time. Delay is fix event time fire
  const PERIODIC_EVENTS = [
    { id: "PeriodicSquadRaptors",              name: "Raptors",              period: 630,  delay: 20,   desc: ""},
    { id: "S1PeriodicPlasmaChaserssoftenrage", name: "Plasma Chasers",       period: 900,  delay: 20,   desc: ""},
    { id: "DropSpinePeriodicd",                name: "Spine",                period: 1987, delay: 0,    desc: ""},
    { id: "DropZerglingsPeriodic",             name: "Zergling",             period: 780,  delay: 20,   desc: ""},
    { id: "DropAberrationPeriodic",            name: "Aberration",           period: 840,  delay: 20,   desc: ""},
    { id: "DropRoachesPeriodic",               name: "Roaches",              period: 550,  delay: 20,   desc: ""},
    { id: "PeriodicSquadHiveGuardians",        name: "Hive Guardians",       period: 2900, delay: 20,   desc: ""},
    { id: "PeriodicSquadBroodLords",           name: "Squad Brood/Bane Lords",          period: 695,  delay: 20,   desc: ""},
    { id: "OldschoolPeriodicBroodlords",       name: "Oldschool Brood Lords",period: 635,  delay: 20,   desc: "Guardian Primal Guardian, Guardian, Primal Guardian, Brood Lord, Bane Lord, Primal Guardian, Brood Lord, Shredder Lord"},
    ];

  const ULTRA_ID = "DropUltraPeriodic";
  const ULTRA_PERIOD = 840;

  const INITIAL_GAME_CLOCK = 20;

  // Portal List
  const PORTAL_EVENTS = [
    { id: 1,  name: "(100)Yagdra" },
    { id: 2,  name: "Roaches" },
    { id: 3,  name: "60, Small 3xZerglings" },
    { id: 4,  name: "#Plasma" },
    { id: 5,  name: "Small Zerglings" },
    { id: 6,  name: "Spine@Previous" },
    { id: 7,  name: "Roaches" },
    { id: 8,  name: "Small Zerglings+Previous" },
    { id: 9,  name: "70, #Plasma@Triple+Previous" },
    { id: 10, name: "95, 2xRoaches" },
    { id: 11, name: "50, SplitterlingNydus" },
    { id: 12, name: "75, Swarm Host" },
    { id: 13, name: "Hunterling Squad" },
    { id: 14, name: "SplitterlingNydus" },
    { id: 15, name: "Small Zerglings+Previous" },
    { id: 16, name: "#Plasma" },
    { id: 17, name: "Small Zerglings+Previous" },
    { id: 18, name: "100, #Hybrids" },
    { id: 19, name: "110, #Yagdra" },
    { id: 20, name: "100, SpineCircle" },
    { id: 21, name: "Hunterling Squad" },
    { id: 22, name: "75, #Plasma@Previous" },
    { id: 23, name: "Creep" },
    { id: 24, name: "2xRoaches" },
    { id: 25, name: "60, 3xRaptorlings" },
    { id: 26, name: "UltraliskNydus" },
    { id: 27, name: "2xRoaches" },
    { id: 28, name: "SporeFountain" },
    { id: 29, name: "75, MassNukes" },
    { id: 30, name: "#Plasma@Previous" },
    { id: 31, name: "Swarm Host" },
    { id: 32, name: "Hunterling Squad" },
    { id: 33, name: "SpawningPool" },
    { id: 34, name: "3xRaptorlings" },
    { id: 35, name: "100, #Hybrids" },
    { id: 36, name: "SporeFountain" },
    { id: 37, name: "#Plasma" },
    { id: 38, name: "SplitterlingNydus" },
    { id: 39, name: "75, #Plasma@Previous" },
    { id: 40, name: "90, Yagdra" },
    { id: 41, name: "2xRoaches" },
    { id: 42, name: "50, Brimstone" },
    { id: 43, name: "120, MassNukes" },
    { id: 44, name: "UltraliskNydus" },
    { id: 45, name: "#Hybrids" },
    { id: 46, name: "SpineCircle" },
    { id: 47, name: "SporeFountain" },
    { id: 48, name: "3xRaptorlings" },
    { id: 49, name: "UltraliskNydus" },
    { id: 50, name: "Swarm Host" },
    { id: 51, name: "200, SpineCircle" },
    { id: 52, name: "3xRaptorlings" },
    { id: 53, name: "UltraliskNydus" },
    { id: 54, name: "Yagdra" },
    { id: 55, name: "200, SpineCircle" },
    { id: 56, name: "#Hybrids" },
    { id: 57, name: "Swarm Host" },
    { id: 58, name: "SpawningPool" },
    { id: 59, name: "#Plasma@Previous" },
    { id: 60, name: "200, SpineCircle" },
    { id: 61, name: "3xRaptorlings" },
    { id: 62, name: "#Plasma@Previous" },
    { id: 63, name: "SpawningPool" },
    { id: 64, name: "#Hybrids" },
    { id: 65, name: "#Plasma@Previous" },
    { id: 66, name: "SporeFountain" },
    { id: 67, name: "#Plasma@Previous" },
    { id: 68, name: "Swarm Host" },
    { id: 69, name: "SplitterlingNydus" },
    { id: 70, name: "[P200], SpineCircle" },
    { id: 71, name: "[P120], MassNukes" },
    { id: 72, name: "#Hybrids" },
    { id: 73, name: "UltraliskNydus" },
    { id: 74, name: "Yagdra" },
    { id: 75, name: "[P200], SpineCircle" },
  ];

  let gameStartReal = Date.now();
  let manualOffset = INITIAL_GAME_CLOCK;
  let ultra = null;
  let isPaused = false;
  let pausedElapsed = 0;

  const HIDDEN_IDS_KEY = "cp2timer_hiddenEventIds";
  let hiddenIds = new Set(JSON.parse(localStorage.getItem(HIDDEN_IDS_KEY) || "[]"));

  function saveHiddenIds() {
    localStorage.setItem(HIDDEN_IDS_KEY, JSON.stringify([...hiddenIds]));
  }

  // ~~~~~ Sound alerts ~~~~~
  const SOUND_PRESETS = [
    { id: "ding",   label: "Soft Ding",     notes: [{ type: "sine",     freq: 880, start: 0,    dur: 0.15, gain: 0.3 }] },
    { id: "double", label: "Double Beep",   notes: [{ type: "square",   freq: 660, start: 0,    dur: 0.08, gain: 0.25 }, { type: "square", freq: 660, start: 0.12, dur: 0.08, gain: 0.25 }] },
    { id: "chirp",  label: "Rising Chirp",  sweep: { type: "triangle", from: 440, to: 880, dur: 0.2, gain: 0.3 } },
    { id: "alert",  label: "Alert (Triple)",notes: [{ type: "sawtooth", freq: 550, start: 0, dur: 0.07, gain: 0.25 }, { type: "sawtooth", freq: 550, start: 0.1, dur: 0.07, gain: 0.25 }, { type: "sawtooth", freq: 550, start: 0.2, dur: 0.07, gain: 0.25 }] },
  ];
  const OFFSET_OPTIONS = [5, 10, 15, 20, 30];

  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  // Browsers block audio until a user gesture; unlock on the first click anywhere.
  document.addEventListener("click", () => getAudioCtx(), { once: true });

  function playOsc(ctx, startTime, type, freqFrom, freqTo, dur, gainVal) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freqFrom, startTime);
    if (freqTo !== freqFrom) osc.frequency.linearRampToValueAtTime(freqTo, startTime + dur);
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(gainVal, startTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + dur + 0.02);
  }

  function playTone(soundId) {
    const preset = SOUND_PRESETS.find(p => p.id === soundId);
    if (!preset) return;
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    if (preset.sweep) {
      const sw = preset.sweep;
      playOsc(ctx, now, sw.type, sw.from, sw.to, sw.dur, sw.gain);
    } else {
      preset.notes.forEach(n => playOsc(ctx, now + n.start, n.type, n.freq, n.freq, n.dur, n.gain));
    }
  }

  const SOUND_SETTINGS_KEY = "cp2timer_soundSettings";
  let soundSettings = JSON.parse(localStorage.getItem(SOUND_SETTINGS_KEY) || "{}");

  function saveSoundSettings() {
    localStorage.setItem(SOUND_SETTINGS_KEY, JSON.stringify(soundSettings));
  }

  // Tracks the last event occurrence (by its nextGameTime) we've already alerted for,
  // so each occurrence only fires its sound once even though render() polls every 250ms.
  const notifiedOccurrence = {};

  function getGameElapsed() {
    if (isPaused) return pausedElapsed;
    const realElapsedSec = (Date.now() - gameStartReal) / 1000;
    return realElapsedSec * GAME_SEC_PER_REAL_SEC + manualOffset;
  }

  function nextOccurrence(delay, period, elapsed) {
    let n = Math.floor((elapsed - delay) / period) + 1;
    if (n < 1) n = 1;
    return delay + n * period;
  }

  function fmtHMS(totalSeconds) {
    const s = Math.max(0, Math.round(totalSeconds));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    const pad = (n) => String(n).padStart(2, "0");
    return `${pad(h)}:${pad(m)}:${pad(sec)}`;
  }

  const eventRowEls = new Map();

  function createEventRow() {
    const row = document.createElement("div");
    row.className = "event-row";
    row.innerHTML = `
      <div class="left">
        <div class="name"></div>
        <div class="desc"></div>
      </div>
      <div class="timer">
        <span class="gametime"></span>
        <span class="countdown"></span>
      </div>
    `;
    return {
      row,
      nameEl: row.querySelector(".name"),
      descEl: row.querySelector(".desc"),
      gametimeEl: row.querySelector(".gametime"),
      countdownEl: row.querySelector(".countdown"),
    };
  }

  function render() {
    const elapsed = getGameElapsed();

    document.getElementById("gameClockVal").textContent = fmtHMS(elapsed);

    const rows = PERIODIC_EVENTS.map(ev => {
      const nextGameTime = nextOccurrence(ev.delay, ev.period, elapsed);
      const gameSecRemaining = nextGameTime - elapsed;
      return { id: ev.id, name: ev.name, desc: ev.desc, nextGameTime, gameSecRemaining, ultra: false };
    });

    if (ultra) {
      const nextGameTime = nextOccurrence(ultra.delay, ULTRA_PERIOD, elapsed);
      const gameSecRemaining = nextGameTime - elapsed;
      rows.push({ id: ULTRA_ID, name: "Ultra", desc: "", nextGameTime, gameSecRemaining, ultra: true });
    }

    rows.forEach(r => {
      const cfg = soundSettings[r.id];
      if (!cfg || !cfg.enabled) return;
      const alreadyNotified = notifiedOccurrence[r.id] === r.nextGameTime;
      if (!alreadyNotified && r.gameSecRemaining > 0 && r.gameSecRemaining <= cfg.offsetSec) {
        playTone(cfg.soundId);
        notifiedOccurrence[r.id] = r.nextGameTime;
      }
    });

    const visibleRows = rows.filter(r => !hiddenIds.has(r.id));
    visibleRows.sort((a, b) => a.gameSecRemaining - b.gameSecRemaining);

    const listEl = document.getElementById("eventList");

    for (const id of eventRowEls.keys()) {
      if (!visibleRows.some(r => r.id === id)) {
        eventRowEls.get(id).row.remove();
        eventRowEls.delete(id);
      }
    }

    visibleRows.forEach((r, i) => {
      let entry = eventRowEls.get(r.id);
      if (!entry) {
        entry = createEventRow();
        eventRowEls.set(r.id, entry);
      }

      const isImminent = i === 0 && r.gameSecRemaining <= 15;
      const wantedClass = `event-row ${i === 0 ? "next" : ""} ${isImminent ? "imminent" : ""} ${r.ultra ? "ultra" : ""}`.trim();
      if (entry.row.className !== wantedClass) entry.row.className = wantedClass;
      entry.nameEl.textContent = r.name;
      entry.descEl.textContent = r.desc;
      entry.gametimeEl.textContent = fmtHMS(r.nextGameTime);
      entry.countdownEl.textContent = `in ${fmtHMS(r.gameSecRemaining)}`;

      const wantedNode = listEl.children[i];
      if (wantedNode !== entry.row) {
        listEl.insertBefore(entry.row, wantedNode || null);
      }
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
  }

  function highlightPlasma(str) {
    return str.replace(/plasma/gi, match => `<span class="plasma-highlight">${match}</span>`);
  }

  function renderStatic() {
    const el = document.getElementById("staticList");
    if (PORTAL_EVENTS.length === 0) {
      el.innerHTML = `<div style="opacity:.6">(no data loaded yet)</div>`;
      return;
    }
    el.innerHTML = PORTAL_EVENTS.map(e =>
      `<div><span class="idx">${e.id}.</span>${highlightPlasma(escapeHtml(e.name))}</div>`
    ).join("");
  }

  document.getElementById("ffBtn").addEventListener("click", () => {
    const minInput = document.getElementById("ffMin");
    const secInput = document.getElementById("ffSec");
    const min = parseFloat(minInput.value) || 0;
    const sec = parseFloat(secInput.value) || 0;
    const val = min * 60 + sec;
    if (val >= 0) {
      if (isPaused) {
        pausedElapsed = val;
      } else {
        const currentElapsed = getGameElapsed();
        manualOffset += val - currentElapsed;
      }
      render();
    }
  });

  function adjustGameClock(deltaSeconds) {
    if (isPaused) {
      pausedElapsed = Math.max(0, pausedElapsed + deltaSeconds);
    } else {
      const currentElapsed = getGameElapsed();
      const newVal = Math.max(0, currentElapsed + deltaSeconds);
      manualOffset += newVal - currentElapsed;
    }
    render();
  }
  document.getElementById("clockMinUp").addEventListener("click", () => adjustGameClock(60));
  document.getElementById("clockMinDown").addEventListener("click", () => adjustGameClock(-60));
  document.getElementById("clockSecUp").addEventListener("click", () => adjustGameClock(1));
  document.getElementById("clockSecDown").addEventListener("click", () => adjustGameClock(-1));

  document.getElementById("pauseBtn").addEventListener("click", () => {
    const btn = document.getElementById("pauseBtn");
    if (isPaused) {
      gameStartReal = Date.now();
      manualOffset = pausedElapsed;
      isPaused = false;
      btn.textContent = "Pause Clock";
    } else {
      pausedElapsed = getGameElapsed();
      isPaused = true;
      btn.textContent = "Resume Clock";
    }
    render();
  });

  document.getElementById("ultraBtn").addEventListener("click", () => {
    const minInput = document.getElementById("ultraInputMin");
    const secInput = document.getElementById("ultraInputSec");
    const min = parseFloat(minInput.value) || 0;
    const sec = parseFloat(secInput.value) || 0;
    const val = min * 60 + sec;
    if (!isNaN(val) && val >= 0) {
      ultra = { delay: val };
      render();
    }
  });

  function onEnterClick(inputId, buttonId) {
    document.getElementById(inputId).addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById(buttonId).click();
    });
  }
  onEnterClick("ffMin", "ffBtn");
  onEnterClick("ffSec", "ffBtn");
  onEnterClick("ultraInputMin", "ultraBtn");
  onEnterClick("ultraInputSec", "ultraBtn");

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (!confirm("Sure to reset game clock?")) return;
    gameStartReal = Date.now();
    manualOffset = INITIAL_GAME_CLOCK;
    ultra = null;
    isPaused = false;
    pausedElapsed = 0;
    document.getElementById("pauseBtn").textContent = "Pause Clock";
    document.getElementById("ultraInputMin").value = "";
    document.getElementById("ultraInputSec").value = "";
    document.getElementById("ffMin").value = "";
    document.getElementById("ffSec").value = "20";
    render();
  });

  function updateFilterBadge() {
    const btn = document.getElementById("filterBtn");
    btn.textContent = hiddenIds.size > 0
      ? `Filter Events (${hiddenIds.size} hidden) ▾`
      : "Filter Events ▾";
  }

  function buildFilterMenu() {
    const menu = document.getElementById("filterMenu");
    const items = PERIODIC_EVENTS.map(ev => ({ id: ev.id, name: ev.name }));
    items.push({ id: ULTRA_ID, name: "Ultra" });

    items.forEach(item => {
      const label = document.createElement("label");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = !hiddenIds.has(item.id);
      checkbox.addEventListener("change", () => {
        if (checkbox.checked) hiddenIds.delete(item.id);
        else hiddenIds.add(item.id);
        saveHiddenIds();
        updateFilterBadge();
        render();
      });
      label.appendChild(checkbox);
      label.append(item.name);
      menu.appendChild(label);
    });
  }

  document.getElementById("filterBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    document.getElementById("filterMenu").classList.toggle("open");
  });
  document.addEventListener("click", (e) => {
    if (!document.getElementById("filterWrap").contains(e.target)) {
      document.getElementById("filterMenu").classList.remove("open");
    }
  });

  function buildSoundMenu() {
    const menu = document.getElementById("soundMenu");
    menu.innerHTML = "";

    const previewRow = document.createElement("div");
    previewRow.className = "preview-row";
    SOUND_PRESETS.forEach(preset => {
      const btn = document.createElement("button");
      btn.textContent = "▶ " + preset.label;
      btn.addEventListener("click", () => playTone(preset.id));
      previewRow.appendChild(btn);
    });
    menu.appendChild(previewRow);

    const items = PERIODIC_EVENTS.map(ev => ({ id: ev.id, name: ev.name }));
    items.push({ id: ULTRA_ID, name: "Ultra" });

    const actionsRow = document.createElement("div");
    actionsRow.className = "sound-actions";
    const allOnBtn = document.createElement("button");
    allOnBtn.textContent = "All On";
    allOnBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      items.forEach(item => {
        if (!soundSettings[item.id]) {
          soundSettings[item.id] = { enabled: true, offsetSec: 10, soundId: SOUND_PRESETS[0].id };
        } else {
          soundSettings[item.id].enabled = true;
        }
      });
      saveSoundSettings();
      buildSoundMenu();
    });
    const allOffBtn = document.createElement("button");
    allOffBtn.textContent = "All Off";
    allOffBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      items.forEach(item => {
        if (soundSettings[item.id]) soundSettings[item.id].enabled = false;
      });
      saveSoundSettings();
      buildSoundMenu();
    });
    actionsRow.append(allOnBtn, allOffBtn);
    menu.appendChild(actionsRow);

    items.forEach(item => {
      if (!soundSettings[item.id]) {
        soundSettings[item.id] = { enabled: false, offsetSec: 10, soundId: SOUND_PRESETS[0].id };
      }
      const cfg = soundSettings[item.id];

      const row = document.createElement("div");
      row.className = "sound-row";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = cfg.enabled;

      const name = document.createElement("span");
      name.className = "ev-name";
      name.textContent = item.name;

      const offsetSelect = document.createElement("select");
      OFFSET_OPTIONS.forEach(sec => {
        const opt = document.createElement("option");
        opt.value = sec;
        opt.textContent = sec + "s before";
        offsetSelect.appendChild(opt);
      });
      offsetSelect.value = cfg.offsetSec;

      const soundSelect = document.createElement("select");
      SOUND_PRESETS.forEach(preset => {
        const opt = document.createElement("option");
        opt.value = preset.id;
        opt.textContent = preset.label;
        soundSelect.appendChild(opt);
      });
      soundSelect.value = cfg.soundId;

      const previewBtn = document.createElement("button");
      previewBtn.className = "preview-btn";
      previewBtn.textContent = "▶";
      previewBtn.addEventListener("click", () => playTone(soundSelect.value));

      checkbox.addEventListener("change", () => {
        cfg.enabled = checkbox.checked;
        saveSoundSettings();
      });
      offsetSelect.addEventListener("change", () => {
        cfg.offsetSec = parseInt(offsetSelect.value, 10);
        saveSoundSettings();
      });
      soundSelect.addEventListener("change", () => {
        cfg.soundId = soundSelect.value;
        saveSoundSettings();
      });

      row.append(checkbox, name, offsetSelect, soundSelect, previewBtn);
      menu.appendChild(row);
    });
  }

  document.getElementById("soundBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    document.getElementById("soundMenu").classList.toggle("open");
  });
  document.addEventListener("click", (e) => {
    if (!document.getElementById("soundWrap").contains(e.target)) {
      document.getElementById("soundMenu").classList.remove("open");
    }
  });

  document.getElementById("filterAllBtn").addEventListener("click", () => {
    hiddenIds.clear();
    document.querySelectorAll("#filterMenu input[type=checkbox]").forEach(cb => cb.checked = true);
    saveHiddenIds();
    updateFilterBadge();
    render();
  });
  document.getElementById("filterNoneBtn").addEventListener("click", () => {
    const items = PERIODIC_EVENTS.map(ev => ev.id).concat([ULTRA_ID]);
    items.forEach(id => hiddenIds.add(id));
    document.querySelectorAll("#filterMenu input[type=checkbox]").forEach(cb => cb.checked = false);
    saveHiddenIds();
    updateFilterBadge();
    render();
  });

  buildFilterMenu();
  updateFilterBadge();
  buildSoundMenu();
  renderStatic();
  render();
  setInterval(render, 250);
</script>

</body>
</html>
